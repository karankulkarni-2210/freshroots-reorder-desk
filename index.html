  return `<span class="${days > 4 ? 'stale' : ''}" title="Stock snapshot dated ${fmtDate(t)}">data ${days ? plural(days, 'day') + ' old' : 'from today'}</span>`;
}

function pageHead(title, sub) {
  const { asOf, summary: s } = state.ev;
  return `<section class="pagehead"><p class="badge"><span class="tag"><span class="live"></span>${state.data.source === 'demo' ? 'Demo run' : 'Live run'}</span>Week of ${fmtDate(asOf)} · ${ageHtml()} · ${plural(s.skus, 'SKU')}</p><h1 class="display">${title}</h1><p class="lede">${sub}</p></section>`;
}

function coverHtml(r) {
  if (r.cover == null) return '<span class="muted">No sales</span>';
  const scale = r.band.max * 1.6, cls = r.stockoutRisk ? 'risk' : r.overstock ? 'over' : '';
  return `<div class="cover" title="Target band ${r.band.min}–${r.band.max} weeks"><span class="n">${r.cover >= 99.5 ? '99+' : r.cover.toFixed(1)}</span>
    <span class="track"><span class="band" style="left:${(r.band.min / scale) * 100}%;width:${((r.band.max - r.band.min) / scale) * 100}%"></span><span class="tick ${cls}" style="left:${(Math.min(r.cover, scale) / scale) * 100}%"></span></span></div>`;
}

function actHtml(action, qty) {
  const [label, cls] = ACTIONS[action];
  return `<span class="act${cls === 'none' ? ' none' : ''}"><span class="dot ${cls}"></span>${label}${qty ? ` <span class="q">${fmtN(qty)}</span>` : ''}</span>`;
}

function rowActions(r, open) {
  const d = state.decisions[r.sku], s = esc(r.sku);
  const review = `<button class="mini review" data-act="toggle" data-sku="${s}" aria-expanded="${open}">${open ? 'Close' : 'Review'}</button>`;
  const viewOnly = state.canWrite === false;
  if (d) return `<span class="ra-in"><span class="done-pill ${d.status}">${ICON.check}${d.status === 'approved' ? 'Approved' : 'Overridden'}</span>${viewOnly ? '' : `<button class="mini icon" data-act="undo" data-sku="${s}" aria-label="Undo this decision" title="Undo this decision">${ICON.undo}</button>`}${review}</span>`;
  if (viewOnly) return `<span class="ra-in">${review}</span>`;
  const locked = LOOK_FIRST[r.tier] && !state.seen[r.sku];
  return `<span class="ra-in"><button class="mini approve${locked ? ' locked' : ''}" data-act="approve" data-sku="${s}" title="${locked ? `This SKU ${LOOK_FIRST[r.tier]}: opens the review first` : 'Approve the rule as shown'}">${ICON.check}Approve</button>${review}</span>`;
}

function rowHtml(r) {
  const open = state.open === r.sku, d = state.decisions[r.sku];
  const change = r.avg12 > 0 ? r.avg4 / r.avg12 - 1 : null;
  return `<tr class="row${open ? ' is-open' : ''}${d ? ' is-done' : ''}" data-act="toggle" data-sku="${esc(r.sku)}" tabindex="0" aria-expanded="${open}">
    <td><span class="id">${esc(r.sku)}</span><span class="nm">${esc(r.name)}${r.perishable ? ' <span class="per">perishable</span>' : ''}</span><div class="ra-m">${rowActions(r, open)}</div></td>
    <td>${coverHtml(r)}</td>
    <td class="num">${fmtN(r.avg4)}${change == null ? '' : `<span class="chg${r.highDemand ? ' fired' : ''}">${change > 0 ? '+' : change < 0 ? '−' : ''}${Math.abs(Math.round(change * 100))}%</span>`}</td>
    <td class="num">${fmtN(r.onHand)}${r.onOrder ? `<span class="sub">+${fmtN(r.onOrder)} on order</span>` : ''}</td>
    <td>${d && d.status === 'overridden' ? actHtml(d.action, d.qty) : actHtml(r.action, r.qty)}</td>
    <td class="num">${r.value ? fmtINR(r.value) : '<span class="muted">₹0</span>'}</td>
    <td><span class="tier ${r.tier}">${TIERS[r.tier]}</span></td>
    <td class="ra">${rowActions(r, open)}</td></tr>` + (open ? detailHtml(r) : '');
}

function trace(r) {
  const t = [];
  if (r.festival) t.push(`Festival month: expected demand lifted 25%, from ${fmtN(r.avg12)} to ${fmtN(r.demand)} units/wk, before the cover checks.`);
  if (r.cover == null) t.push('No sales in the last 12 weeks, so cover cannot be worked out and no rule fires.');
  else t.push(`${fmtN(r.onHand)} on hand${r.onOrder ? ` plus ${fmtN(r.onOrder)} already on order` : ''} covers ${r.cover.toFixed(1)} weeks, against a ${r.band.min}–${r.band.max} week band${r.perishable ? ' (perishable)' : ''}.`);
  if (r.highDemand) t.push(`The last 4 weeks averaged ${fmtN(r.avg4)}/wk, ${Math.round((r.avg4 / r.avg12 - 1) * 100)}% above the 12-week ${fmtN(r.avg12)}/wk: high demand.`);
  if (r.overstock && r.highDemand) t.push('Overstock and high demand both fired; the pause wins (assumption A1).');
  t.push('Rule result: ' + ACTIONS[r.action][0] + (r.qty ? `, ${fmtN(r.qty)} units` : '') + '.');
  return t;
}

function reasonDetail(r, code) {
  if (code === 'new_sku') return `${r.history} week${r.history === 1 ? '' : 's'} of sales history; the rules need 12.`;
  if (code === 'demand_spike') return `The last 4 weeks averaged ${fmtN(r.avg4)}/wk against ${fmtN(r.avg12)}/wk over 12 weeks.`;
  if (code === 'distributor_shift') return 'Their share of this SKU moved sharply; see the table.';
  if (code === 'perishable_action') return 'Write-offs concentrate in perishables, so every order change here gets a person.';
  if (code === 'data_gap') return 'This SKU has no stock row for the run week. Check the export.';
  if (code === 'no_recent_sales') return 'It may be delisted, or sold out so long that there is nothing to average.';
  return '';
}

function detailHtml(r) {
  const id = domId(r.sku);
  const shifts = r.shifts.length ? `<table class="shifts"><thead><tr><th>Distributor</th><th class="num">Share of SKU</th><th class="num">Share change</th></tr></thead><tbody>${
    r.shifts.map(s => `<tr><td>${esc(s.distributor)}</td><td class="num">${Math.round(s.share * 100)}%</td><td class="num">${s.change > 0 ? '+' : '−'}${Math.abs(Math.round(s.change * 100))}%</td></tr>`).join('')}</tbody></table>
    <p class="small muted">Last 4 weeks against the 8 before.</p>` : '';
  return `<tr class="detail"><td colspan="8"><div class="dgrid">
    <div class="card"><div class="chart-head"><h3>Units sold per week</h3><ul class="legend" aria-hidden="true"><li><span class="sw-bar"></span>Last 4 weeks</li><li><span class="sw-ref"></span>12-week average</li></ul></div><div class="chart" data-bars="${esc(r.sku)}"></div>
      <dl class="facts">
        <div><dt>On hand</dt><dd>${fmtN(r.onHand)}</dd></div><div><dt>On order</dt><dd>${fmtN(r.onOrder)}</dd></div>
        <div><dt>Standard order</dt><dd>${fmtN(r.standardQty)}</dd></div><div><dt>Lead time</dt><dd>${r.leadTimeWeeks} wk</dd></div>
        <div><dt>Unit cost</dt><dd>₹${fmtN(r.unitCost)}</dd></div><div><dt>History</dt><dd>${r.history} wk</dd></div>
      </dl></div>
    <div class="card"><h3>Why the rules say this</h3><ul class="list">${trace(r).map(t => `<li>${esc(t)}</li>`).join('')}</ul>
      ${r.reasons.length ? `<h3>Why it needs your judgment</h3><ul class="list">${r.reasons.map(c => `<li><b>${esc(E.REASONS[c])}.</b> ${esc(reasonDetail(r, c))}</li>`).join('')}</ul>${shifts}` : ''}</div>
    ${r.tier === 'judgment' ? `<div class="card ai">${briefHtml(r)}</div>` : ''}
    <div class="card"><h3>Decision</h3>${decideHtml(r, id)}</div>
  </div></td></tr>`;
}

function briefHtml(r) {
  const head = `<div class="ai-head"><span class="ic" style="width:32px;height:32px;border-radius:10px">${ICON.spark}</span><h3>AI brief</h3><span class="chip watch">Draft, not a decision</span></div>`;
  if (!state.capsReady) return head + '<p class="muted">Connecting…</p>';
  if (!sample || state.aiOff) return head + '<p class="muted">AI briefs are not available in this view. Decide from the numbers.</p>';
  const b = state.briefs[r.sku];
  if (state.drafting && (!b || b.missing)) return head + `<p class="muted">Drafting… ${state.drafting.done} of ${state.drafting.total} done.</p>`;
  if (!b) return head + `<p class="muted">Summarises the numbers, says what to check, and offers a suggestion you can take or leave.</p><div class="btns"><button class="btn sm" data-act="brief" data-sku="${esc(r.sku)}">${ICON.spark}Draft brief</button></div>`;
  if (b.missing) return head + `<p>No brief came back for this SKU. Decide from the numbers, or try again.</p><div class="btns"><button class="btn sm" data-act="rebrief" data-sku="${esc(r.sku)}">Draft again</button></div>`;
  const ul = xs => `<ul class="list">${xs.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
  const canFill = ['reduce_qty', 'increase_qty', 'hold'].includes(b.suggestion) && !state.decisions[r.sku] && state.canWrite !== false;
  return head + `<p>${esc(b.summary)}</p>
    <p class="sug">Suggests: ${esc(SUGGESTIONS[b.suggestion])}${b.qty != null ? ', ' + fmtN(b.qty) + ' units' : ''} <span class="muted small">· ${esc(b.confidence)} confidence</span></p>
    ${b.hypotheses.length ? '<p class="small muted">Possible causes, unconfirmed</p>' + ul(b.hypotheses) : ''}
    ${b.checkFirst.length ? '<p class="small muted">Check before deciding</p>' + ul(b.checkFirst) : ''}
    ${b.note ? `<p class="small" style="color:var(--risk)">${esc(b.note)}</p>` : ''}
    <div class="btns">${canFill ? `<button class="btn sm" data-act="useai" data-sku="${esc(r.sku)}">Copy into the override</button>` : ''}<button class="btn sm text" data-act="rebrief" data-sku="${esc(r.sku)}">Redraft</button></div>
    <p class="small muted">Drafted ${esc(fmtTime(b.at))}</p>`;
}

function decideHtml(r, id) {
  const d = state.decisions[r.sku];
  if (d) {
    return `<p><b>${d.status === 'approved' ? 'Approved' : 'Overridden'}:</b> ${actHtml(d.action, d.qty)}</p>
      ${d.reason ? `<p>Reason: ${esc(OVERRIDE_REASONS[d.reason] || d.reason)}${d.note ? '. ' + esc(d.note) : ''}</p>` : ''}
      <p class="small muted">By ${esc(nameOf(d.by))} · ${esc(fmtTime(d.at))}</p>
      ${state.canWrite === false ? '' : `<div class="btns"><button class="btn sm" data-act="undo" data-sku="${esc(r.sku)}">Undo decision</button></div>`}`;
  }
  if (state.canWrite === false) return '<p class="muted">View only. Editors (Raghav and Deepa) approve and override; you can review and export.</p>';
  const f = draftFor(r);
  const opts = (map, sel) => Object.entries(map).map(([k, v]) => `<option value="${k}"${k === sel ? ' selected' : ''}>${esc(Array.isArray(v) ? v[0] : v)}</option>`).join('');
  return `<div class="btns"><button class="btn lime" data-act="approve" data-sku="${esc(r.sku)}">${ICON.check}${r.action === 'standard' ? 'Confirm no change' : 'Approve ' + ACTIONS[r.action][0].toLowerCase() + (r.qty ? ' ' + fmtN(r.qty) : '')}</button></div>
    <p class="small muted">Or override</p>
    <div class="ovr" data-sku="${esc(r.sku)}">
      <label for="ov-a-${id}">Action<select id="ov-a-${id}" data-draft="action">${opts(ACTIONS, f.action)}</select></label>
      <label for="ov-q-${id}">Quantity, units<input id="ov-q-${id}" type="number" min="0" step="50" inputmode="numeric" data-draft="qty" value="${esc(f.qty)}"></label>
      <label class="wide" for="ov-r-${id}">Reason<select id="ov-r-${id}" data-draft="reason"><option value="">Choose a reason</option>${opts(OVERRIDE_REASONS, f.reason)}</select></label>
      <label class="wide" for="ov-n-${id}">Note<input id="ov-n-${id}" type="text" maxlength="200" data-draft="note" value="${esc(f.note)}" placeholder="What you know that the numbers don't"></label>
    </div>
    <div class="btns"><button class="btn sm" data-act="override" data-sku="${esc(r.sku)}">Save override</button></div>`;
}

function queueHtml() {
  const rows = state.ev.rows;
  const decided = rows.filter(r => state.decisions[r.sku]).length;
  const left = t => rows.filter(r => (t === 'all' || r.tier === t) && !state.decisions[r.sku]).length;
  const q = state.q.trim().toLowerCase();
  const view = VIEWS[state.filter];
  const shown = rows.filter(r => inView(r, state.filter) && (!q || r.sku.toLowerCase().includes(q) || r.name.toLowerCase().includes(q)))
    .sort((a, b) => ORDER.indexOf(a.tier) - ORDER.indexOf(b.tier) || b.value - a.value);
  const bulkLeft = left('bulk');
  const needBrief = rows.filter(r => r.tier === 'judgment' && (!state.briefs[r.sku] || state.briefs[r.sku].missing));
  const viewOnly = state.canWrite === false;
  const aiBtn = !state.capsReady || !sample || state.aiOff || viewOnly ? ''
    : state.drafting ? `<button class="btn sm" data-act="stopdraft">Stop drafting · ${state.drafting.done} of ${state.drafting.total}</button>`
    : needBrief.length ? `<button class="btn sm" data-act="briefall">${ICON.spark}Draft AI briefs for ${plural(needBrief.length, 'judgment case')}</button>` : '';
  return `<section class="panel section" id="queue" aria-label="Review queue">
    <div class="qhead">
      <div><h2>Review queue</h2><div class="progress"><span class="bar"><span style="width:${(decided / rows.length) * 100}%"></span></span><span><b class="num">${fmtN(decided)}</b> of ${fmtN(rows.length)} decided · ${fmtN(left('judgment'))} judgment left</span></div></div>
      <div class="qactions">${aiBtn}${viewOnly ? '<span class="chip watch">View only</span>' : `<button class="btn sm${state.confirmBulk ? ' lime' : ''}" data-act="bulk" ${bulkLeft ? '' : 'disabled'}>${state.confirmBulk ? `Confirm: approve ${fmtN(bulkLeft)} rows` : `Approve all ${fmtN(bulkLeft)} rule-clean`}</button>`}</div>
    </div>
    <div class="seg" role="tablist" aria-label="Review type">
      ${['all', ...ORDER].map(t => `<button role="tab" aria-selected="${state.filter === t}" data-act="filter" data-f="${t}">${t === 'all' ? 'All' : TIERS[t]}<span class="count">${fmtN(left(t))}</span></button>`).join('')}
    </div>
    ${view ? `<div class="viewing"><span class="t-dot" style="--acc:var(${ACC[state.filter]})"></span><span>Showing <b>${view[0]}</b> · ${plural(shown.length, 'line')}</span><button class="mini" data-act="filter" data-f="all">Show all</button></div>` : ''}
    <p class="help">${view ? view[2] : TIER_HELP[state.filter]} <span class="quiet">Counts are rows still to review.</span></p>
    <div class="toolbar">
      <input class="search" id="q" type="search" placeholder="Find a SKU or product" value="${esc(state.q)}" aria-label="Find a SKU or product">
      <span class="quiet">${plural(shown.length, 'SKU')}${state.capsReady && !db ? ' · decisions stay in this tab until you sign in' : ''}</span>
    </div>
    ${state.csvFallback ? `<div class="card"><p>Downloads are not available here. Copy this CSV and save it as a .csv file for Zoho Inventory.</p><textarea id="csvout" readonly aria-label="CSV for Zoho">${esc(state.csvFallback)}</textarea><div class="btns"><button class="btn sm" data-act="copycsv">Copy CSV</button><button class="btn sm text" data-act="closecsv">Close</button></div></div>` : ''}
    <div class="tablebox"><table class="queue">
      <thead><tr><th>SKU</th><th>Cover, weeks</th><th class="num">Units/wk, last 4</th><th class="num">On hand</th><th>Rule says</th><th class="num">At stake</th><th>Review</th><th class="num">Action</th></tr></thead>
      <tbody>${shown.length ? shown.map(rowHtml).join('') : `<tr class="empty-row"><td colspan="8">${q ? `No SKU matches “${esc(state.q)}” in this view.` : 'Nothing in this view.'}</td></tr>`}</tbody>
    </table></div>
    <p class="small foot">Cover bar: the pale band is the target (6–14 weeks, perishables 3–4); the mark is where the SKU stands after the festival uplift, red under the band, amber over it. The % beside units is the last 4 weeks against the 12-week average, lit when the high-demand rule fires. This desk never creates or sends a purchase order: procurement orders in Zoho Inventory from the exported approved lines.</p>
  </section>`;
}

function evidenceHtml() {
  const bt = state.bt, kb = killB();
  const reasons = {};
  for (const r of kb.rows) for (const d of r.ds) if (d.reason) reasons[d.reason] = (reasons[d.reason] || 0) + 1;
  const reasonRows = Object.entries(reasons).sort((a, b) => b[1] - a[1]);
  const demo = state.data.source === 'demo';
  return `<div class="panels">
    <section class="panel"><h2>Outcome this desk must prove</h2>
      <p>Lost sales from stockouts plus perishable write-offs fall from <b>₹28–34L</b> a quarter to <b>₹22–26L or less</b> in the first full quarter after go-live, with procurement ordering on data no more than 4 days old instead of 3–4 weeks.</p>
      <table><tbody>
        <tr><td>Stockout lost sales</td><td class="num">₹18–22L / quarter</td><td class="muted">Deepa's estimate</td></tr>
        <tr><td>Write-offs, mostly perishables</td><td class="num">₹10–12L / quarter</td><td class="muted">Deepa's estimate</td></tr>
        <tr><td>Data age when procurement acts</td><td class="num">3–4 weeks</td><td class="muted">stated in the case</td></tr>
        <tr><td>Planner time per cycle</td><td class="num">2 days / month</td><td class="muted">stated in the case</td></tr>
        <tr><td>Decisions the rules cover</td><td class="num">80–85%</td><td class="muted">Raghav's estimate</td></tr>
      </tbody></table>
      <p class="small muted">The ₹ result is read from SAP each quarter, not from this page. Before go-live, confirm how the ₹ figures were worked out and pull weekly stockout counts per SKU.</p>
    </section>
    <section class="panel"><h2>Backtest: would faster runs have caught past stockouts?</h2>
      <p>For each of the <b>${fmtN(bt.events)}</b> past stockouts in this data, the order deadline is the stockout week minus the SKU's lead time. A stockout counts as caught if a run in the 4 weeks before that deadline asked for a reorder.</p>
      <div id="bt-bullet"></div>
      <p class="small muted">The tick is kill check A at 50%: below it for weekly runs, stop and recalibrate the rules. Weekly data can only simulate weekly runs on last week's data; twice-weekly runs on data under 4 days old can only do better.</p>
      ${demo ? '<p class="notice">Synthetic history built with a monthly process, so this shows the method, not evidence. Run it on the 3-year SAP export.</p>' : ''}
    </section>
    <section class="panel"><h2>Override rate in the first four weeks</h2>
      ${kb.rows.length ? `<table><thead><tr><th>Week</th><th class="num">Decided</th><th class="num">Overridden</th><th class="num">Rate</th><th class="num">Followed AI</th></tr></thead><tbody>${
        kb.rows.map(r => `<tr><td>${fmtDate(r.asOf)}${r.asOf === state.ev.asOf ? ' <span class="muted">· includes this run</span>' : ''}</td><td class="num">${fmtN(r.decided)}</td><td class="num">${fmtN(r.over)}</td><td class="num">${pct(r.rate, 1)}</td><td class="num">${r.aiN ? pct(r.aiAgree) + ' of ' + r.aiN : 'none'}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">No decisions saved yet.</p>'}
      <p class="small muted">Kill check B: stop if more than 25% of at least 10 decisions are overridden in 2 of the first 4 weeks. A week adds up its Monday and Thursday runs. Followed AI is a warning light: near 100% with fast reviews can mean briefs are being rubber-stamped.</p>
    </section>
    <section class="panel"><h2>What Raghav knows that the rules don't</h2>
      ${reasonRows.length ? `<table><thead><tr><th>Override reason</th><th class="num">Times</th></tr></thead><tbody>${reasonRows.map(([k, n]) => `<tr><td>${esc(OVERRIDE_REASONS[k] || k)}</td><td class="num">${n}</td></tr>`).join('')}</tbody></table>`
        : '<p class="muted">No overrides yet. Each one is logged here with its reason.</p>'}
      <p class="small muted">A reason that keeps coming back is a candidate rule. Writing it down also makes the process depend less on one person.</p>
    </section>
  </div>`;
}

function dataHtml() {
  const R = E.RULES, J = E.JUDGMENT, up = state.upload;
  const fileField = ([id, name, spec]) => `<label for="${id}">${name} <span class="spec">${spec}</span><input id="${id}" type="file" accept=".csv,text/csv">${state.files[id] ? `<span class="chosen">Chosen: ${esc(state.files[id].name)}</span>` : ''}</label>`;
  return `<div class="panels">
    <section class="panel"><h2>Run on this week's SAP export</h2>
      <p>IT exports three CSV files twice a week, covering the last 60 weeks. Column names must match; extra columns are ignored. Dates can be YYYY-MM-DD or DD.MM.YYYY and are grouped into Monday weeks. Date the latest stock rows with the day of the snapshot: that date names the run, so Monday's and Thursday's exports stay separate.</p>
      <div class="files">${[['f-sku', 'sku_master.csv', 'sku, name, category, perishable (Y/N), standard_qty, lead_time_weeks, unit_cost'], ['f-sales', 'sales.csv', 'sku, distributor, week, units'], ['f-stock', 'stock.csv', 'sku, week, on_hand, on_order (open Zoho purchase orders; blank = 0)']].map(fileField).join('')}</div>
      <div class="btns"><button class="btn lime" data-act="upload">Run the rules on these files ${ICON.arrow}</button><button class="btn" data-act="demo">Reload demo data</button>${downloads ? '<button class="btn text" data-act="demofiles">Download the demo as CSV files</button>' : ''}</div>
      ${up.issues.length ? `<ul class="issues">${up.issues.map(i => `<li>${esc(i)}</li>`).join('')}</ul>` : ''}
      ${up.note ? `<p>${esc(up.note)}</p>` : ''}
      <p class="small muted">Files are read in this browser. Only decisions and AI briefs are saved, never the export itself.</p>
    </section>
    <section class="panel"><h2>What this desk never does</h2>
      <p class="cut"><b>It never creates, changes or sends a purchase order.</b> It recommends, a person approves, and procurement places the order in Zoho Inventory from the exported approved lines.</p>
      <ul>
        <li>The page has no connection to Zoho or SAP. It reads uploaded files and writes decisions.</li>
        <li>Only Editors (Raghav and Deepa) can save decisions. Everyone else sees the desk read-only and can still review and export.</li>
        <li>Every row starts unapproved. Judgment, top-value and spot-check rows open their review before Approve works; only rule-clean rows approve in one click or all together.</li>
        <li>The AI drafts briefs for judgment cases only. Its output is stored apart from decisions and cannot approve, override or export anything. A suggested quantity above 3× standard is dropped.</li>
        <li>Each decision records who made it, when, the rule's answer and the AI's suggestion, so overrides and agreement can be audited.</li>
      </ul>
    </section>
    <section class="panel"><h2>Raghav's rules</h2>
      <ol>
        <li>Last 4 weeks' average more than ${Math.round((R.highDemandRatio - 1) * 100)}% above the 12-week average: high demand, reorder ${R.highDemandQtyMultiplier}× the standard quantity.</li>
        <li>Stock on hand plus on order below ${R.cover.standard.min} weeks of average sales: stockout risk, reorder now.</li>
        <li>Stock on hand plus on order above ${R.cover.standard.max} weeks: overstock risk, pause the next order.</li>
        <li>October, November and March: +${Math.round((R.festivalUplift - 1) * 100)}% demand before any check.</li>
        <li>Perishables: at most ${R.cover.perishable.max} weeks of stock, at least ${R.cover.perishable.min}.</li>
      </ol>
      <p class="small muted">Sent to judgment instead: under ${J.minHistoryWeeks} weeks of history or no sales in 12 weeks; last 4 weeks above ${J.spikeRatio}× the 12-week average; a distributor with ${J.distributorMinShare * 100}% or more of the SKU whose share moved over ${J.distributorShift * 100}%; any order change on a perishable; a missing stock figure.</p>
    </section>
    <section class="panel"><h2>Assumptions to confirm with Raghav</h2>
      <ul>
        <li>A1. When high demand and overstock both fire, the pause wins.</li>
        <li>A2. A stockout-risk reorder uses the standard quantity, or 1.5× if high demand also fires.</li>
        <li>A3. On-hand stock is Freshroots' own stock per SKU, not stock held by distributors.</li>
        <li>A4. The festival uplift follows the month of the run's data week.</li>
        <li>A5. Lead time per SKU comes from the SKU master; the case does not give it.</li>
        <li>A6. Stock already on order counts toward cover, so an order approved on Monday is not placed again on Thursday.</li>
        <li>A7. Averages use the 12 complete weeks before the stock snapshot; the week still running is left out.</li>
      </ul>
    </section>
  </div>`;
}

function creditsHtml() {
  return `<p class="credits">Photograph: <a href="https://commons.wikimedia.org/wiki/File:Moss-covered_decaying_fallen_log_with_shallow_depth_of_field.jpg" target="_blank" rel="noopener">“Moss-covered decaying fallen log with shallow depth of field”</a> by Krishna k. sahh, <a href="https://creativecommons.org/publicdomain/zero/1.0/deed.en" target="_blank" rel="noopener">CC0</a>, via Wikimedia Commons.</p>`;
}

function drawCharts() {
  if (!window.Charts) return;
  document.querySelectorAll('[data-bars]').forEach(el => {
    const r = rowBy(el.dataset.bars);
    const labels = r.units12.map((_, i) => fmtShort(E.addWeeks(state.ev.asOf, i - 11)));
    Charts.bars(el, { labels, values: r.units12, highlight: [8, 9, 10, 11], height: 160, reference: { value: Math.round(r.avg12) }, xAt: [0, 4, 8] });
  });
  const bb = $('#bt-bullet');
  if (bb && state.bt.events) Charts.bullet(bb, [
    { label: 'Weekly runs, last week\'s data', value: state.bt.weeklyRate, target: 0.5, tolerance: 9 },
    { label: 'Monthly runs, data 3 weeks old', value: state.bt.monthlyRate, target: 0.5, tolerance: 9 },
  ], { max: 1 });
}

// ---------- events ----------

// The tag keeps a row and its own Review button apart; both carry the same data attributes.
const selectorFor = el => {
  let s = el.tagName.toLowerCase() + `[data-act="${el.dataset.act}"]`;
  for (const k of ['sku', 'tab', 'f']) if (el.dataset[k] != null) s += `[data-${k}="${CSS.escape(el.dataset[k])}"]`;
  return s;
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act, sku = el.dataset.sku;
  if (act === 'toggle' && el.tagName === 'TR' && e.target.closest('tr.detail')) return;
  // Every click lights up: the clicked control now, and its re-rendered twin after the update.
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  lastClick = selectorFor(el);
  setTimeout(() => { lastClick = null; }, 0);   // a click that never re-renders must not flash on a later, unrelated render
  if (act === 'tab') { state.tab = el.dataset.tab; renderAll(); window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' }); return; }
  if (act === 'start' || act === 'jump') {
    state.filter = act === 'jump' ? el.dataset.f : state.ev.rows.some(r => r.tier === 'judgment' && !state.decisions[r.sku]) ? 'judgment' : 'all';
    state.open = null;
    renderAll();
    // Light up where the jump lands, so the eye follows it down the page.
    for (const n of document.querySelectorAll('#queue .seg [aria-selected="true"], #queue .viewing')) n.classList.add('flash');
    document.getElementById('queue').scrollIntoView({ behavior: reduced() ? 'auto' : 'smooth', block: 'start' });
    return;
  }
  if (act === 'toggle') {
    state.open = state.open === sku ? null : sku;
    if (state.open) state.seen[sku] = true;
    state.flashRow = sku;
    renderAll();
    return;
  }
  if (act === 'filter') { state.filter = el.dataset.f; state.open = null; renderAll(); return; }
  if (act === 'approve') return approve(sku);
  if (act === 'override') return saveOverride(sku);
  if (act === 'undo') return undo(sku);
  if (act === 'brief') return draftBriefs([rowBy(sku)]);
  if (act === 'rebrief') return draftBriefs([rowBy(sku)], true);
  if (act === 'briefall') return draftBriefs(state.ev.rows.filter(r => r.tier === 'judgment' && (!state.briefs[r.sku] || state.briefs[r.sku].missing)));
  if (act === 'stopdraft') { if (state.drafting) state.drafting.ctl.abort(); return; }
  if (act === 'useai') {
    const r = rowBy(sku), b = state.briefs[sku], f = draftFor(r);
    if (b.suggestion === 'hold') { f.action = 'standard'; f.qty = 0; } else { f.action = r.action === 'standard' ? 'reorder' : r.action; f.qty = b.qty != null ? b.qty : r.qty; }
    renderAll();
    toast('Suggestion copied. Choose a reason and save the override if you agree.');
    return;
  }
  if (act === 'bulk') {
    if (!state.confirmBulk) { state.confirmBulk = true; renderAll(); setTimeout(() => { if (state.confirmBulk) { state.confirmBulk = false; renderAll(); } }, 5000); return; }
    return approveBulk();
  }
  if (act === 'export') return exportZoho();
  if (act === 'copycsv') {
    const ta = $('#csvout');
    navigator.clipboard.writeText(state.csvFallback).then(() => toast('CSV copied.'), () => { ta.focus(); ta.select(); toast('Selected. Press Ctrl or Cmd + C to copy.'); });
    return;
  }
  if (act === 'closecsv') { state.csvFallback = ''; renderAll(); return; }
  if (act === 'upload') return loadUpload();
  if (act === 'demofiles') return downloadDemo();
  if (act === 'demo') { load(E.demoData()); state.upload = { issues: [], note: '' }; state.tab = 'queue'; renderAll(); toast('Demo data reloaded.'); }
});

document.addEventListener('keydown', e => {
  const tr = e.target.closest && e.target.closest('tr.row');
  if (tr && e.target === tr && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tr.click(); }
});

let qTimer;
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { state.q = el.value; state.open = null; renderAll(); const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 180);
    return;
  }
  if (el.dataset && el.dataset.draft) draftFor(rowBy(el.closest('.ovr').dataset.sku))[el.dataset.draft] = el.value;
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.type === 'file') { state.files[el.id] = el.files[0]; lastClick = '#' + el.id; renderAll(); return; }
  if (el.dataset && el.dataset.draft) draftFor(rowBy(el.closest('.ovr').dataset.sku))[el.dataset.draft] = el.value;
});
document.addEventListener('focusout', e => {
  if (state.pendingRender && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('tr.detail'))) setTimeout(renderAll, 0);
});

// ---------- start ----------

load(E.demoData());
(async () => {
  const use = n => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  [db, user, sample, downloads] = await Promise.all([use('db'), use('user'), use('sample'), use('downloads')]);
  if (user) { const me = await user.me(); state.me = me.id; state.meName = me.name; state.canWrite = await user.can('data.write'); }
  state.capsReady = true;
  if (db) { state.runLoaded = false; subscribeRun(); } else state.runLoaded = true;
  resolveNames();
  renderAll();
})();
})();
</script>
